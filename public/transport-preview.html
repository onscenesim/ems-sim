<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transport animation preview</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .preview-controls { position: fixed; z-index: 200; top: 12px; left: 12px; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100vw - 24px); }
    .preview-controls button { padding: 7px 10px; font: 13px monospace; cursor: pointer; }
    .preview-controls label { display: flex; align-items: center; gap: 5px; padding: 7px; font: 13px monospace; background: #deded6; }
  </style>
</head>
<body>
  <div class="preview-controls">
    <button data-scene="loading" data-mode="start">Loading start</button>
    <button data-scene="loading" data-mode="play">Play loading</button>
    <button data-scene="loading" data-mode="end">Loading end</button>
    <button data-scene="depart" data-mode="start">Transport start</button>
    <button data-scene="depart" data-mode="play">Play transport</button>
    <button data-scene="depart" data-mode="end">Transport end</button>
    <label><input id="slow-motion" type="checkbox">Slow motion</label>
    <label>Patient <select id="preview-patient">
      <option value="adult">Adult male</option>
      <option value="female">Adult female</option>
      <option value="child">Child (4–13)</option>
      <option value="baby">Baby (under 4)</option>
    </select></label>
  </div>
  <script>
    (async () => {
      const source = new DOMParser().parseFromString(await (await fetch('index.html')).text(), 'text/html');
      document.body.append(document.importNode(source.querySelector('svg.procedure-defs'), true));
      for (const id of ['loading', 'depart']) {
        document.body.append(document.importNode(source.getElementById(`${id}-overlay`), true));
      }
      await Promise.all(['patient-privacy.js?v=1', 'transport-patient.js?v=1'].map(src => new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = src; script.onload = resolve; script.onerror = reject;
        document.body.append(script);
      })));
      const patients = {
        adult: { age: 35, sex: 'male' }, female: { age: 35, sex: 'female' },
        child: { age: 9, sex: 'female' }, baby: { age: 2, sex: 'male' },
      };
      const patientSelect = document.getElementById('preview-patient');
      patientSelect.addEventListener('change', () => {
        window.TransportPatient.apply(document.getElementById('loading-overlay'), patients[patientSelect.value]);
        document.querySelector('[data-scene="loading"][data-mode="start"]').click();
      });
      let timer, stopPrivacy;
      document.querySelector('.preview-controls').addEventListener('click', event => {
        const { scene, mode } = event.target.dataset;
        if (!scene) return;
        clearTimeout(timer);
        stopPrivacy?.();
        for (const id of ['loading', 'depart']) {
          document.getElementById(`${id}-overlay`).classList.remove('visible', 'is-fading');
        }
        const overlay = document.getElementById(`${scene}-overlay`);
        if (scene === 'loading') window.TransportPatient.apply(overlay, patients[patientSelect.value]);
        const speed = document.getElementById('slow-motion').checked ? 4 : 1;
        const travel = (scene === 'loading' ? 2200 : 1100) * speed;
        overlay.style.setProperty('--transport-travel', `${travel}ms`);
        overlay.style.setProperty('--transport-start', mode === 'start' ? '100000ms' : mode === 'end' ? `${-travel}ms` : `${(scene === 'loading' ? 100 : 700) * speed}ms`);
        overlay.style.setProperty('--transport-fade', scene === 'loading' ? '220ms' : '250ms');
        void overlay.offsetWidth;
        overlay.classList.add('visible');
        stopPrivacy = window.PatientPrivacy.start(overlay, { held: mode !== 'play' });
        if (mode === 'play') {
          timer = setTimeout(() => {
            overlay.classList.add('is-fading');
            timer = setTimeout(() => stopPrivacy?.(), scene === 'loading' ? 220 : 250);
          }, (scene === 'loading' ? 2600 : 1800) * speed);
        }
      });
      document.querySelector('[data-scene="loading"][data-mode="start"]').click();
    })();
  </script>
</body>
</html>
