<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="cosmetics.css?v=6"><style>body{margin:0;padding:32px;background:#d9d8c4;font-family:Arial,sans-serif}main{max-width:680px;margin:auto}.pen-display{margin:26px 0 48px}.pen-stage{max-width:640px}h2{font-size:16px;font-weight:normal}.pen-control{position:absolute;top:20%;height:62%;border:0;background:transparent;cursor:pointer}.pen-control-cap{left:0;width:53%}.is-extended .pen-control-cap{top:56%;height:42%}</style></head>
<body><main><h2>Capped</h2><div id="capped" class="pen-display"></div><h2>Cap set beside pen</h2><div id="posted" class="pen-display"></div></main><script src="pen-kit.js?v=8"></script><script>PenKit.mount(document.getElementById('capped'),'green',{soundEnabled:()=>false});PenKit.mount(document.getElementById('posted'),'green',{soundEnabled:()=>false});document.getElementById('posted').querySelector('.pen-control-cap').click();</script></body></html>
