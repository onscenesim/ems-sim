services:
  - type: web
    name: ems-sim
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev --ignore-scripts
    startCommand: node bin/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: EMS_DATA_DIR
        value: /var/data
    disk:
      name: ems-sim-data
      mountPath: /var/data
      sizeGB: 1
