    const review = {version:5,scored:false,score:null,
      debriefText:"### 1. SCENE & ASSESSMENT\nYou performed an immediate size-up and quickly recognized cardiac arrest, noting the hyperinflated chest and empty inhalers on scene. You established an advanced airway rapidly while gathering essential history regarding the patient's silent chest prior to collapse. However, you failed to obtain a blood glucose measurement during both the active resuscitation and post-ROSC care.\n\n### 2. CLINICAL DECISION-MAKING\nYour decision to disconnect the BVM and manually compress the chest at T+10min was a critical, life-saving intervention. In severe asthma, dynamic hyperinflation creates severe auto-PEEP that elevates intrathoracic pressure, impedes venous return, and causes obstructive PEA arrest; venting that trapped air restored preload and led directly to ROSC. Transitioning to IO access after failed peripheral attempts prevented further medication delays. Your post-ROSC management was clinically sound, utilizing magnesium sulfate, Solu-Medrol, inline nebulized albuterol, and ketamine—which provides beneficial bronchodilation alongside sedation.\n\n### 3. WHAT THIS PATIENT ACTUALLY HAD\nThe primary acute condition was an obstructive and hypoxic cardiac arrest secondary to status asthmaticus and critical dynamic hyperinflation (auto-PEEP). The underlying context was severe chronic asthma with days of escalating symptoms and acute bronchospasm leading to air trapping and cardiovascular collapse.\n\n### 4. KEY TAKEAWAYS\n* **Disconnect the circuit to relieve auto-PEEP in asthmatic arrest:** Severe air trapping dramatically increases intrathoracic pressure and halts venous return; disconnecting the bag and compressing the chest vents trapped gas and restores cardiac preload.\n* **Select ketamine for post-ROSC sedation in reactive airway disease:** Ketamine provides potent dissociative sedation while inducing catecholamine release and direct smooth-muscle relaxation to help alleviate severe bronchospasm.\n* **Obtain a blood glucose level during arrest and post-ROSC management:** Hypoglycemia is a rapidly reversible metabolic etiology that can complicate resuscitation and post-cardiac arrest neurological recovery if left undetected.\n\n### 5. PROTOCOL CHECK\nThis is your cue to pull your own local protocols and the NREMT skills checklist and check them against how you ran this call. Simulation scope and your real-world scope may differ — your protocols are the final authority.",
