  <script>
    const turns = [
      {turn:1,minute:0.5,patient:'patient_1',action:'Check scene safety, introduce myself, and begin a primary assessment.',scene:'The patient looks toward you and answers in short sentences.',report:false,skip:false,procedures:[{id:'scene_safety',patient:'patient_1',outcome:'SUCCESS',intervention:false,noRoll:true,roll:null,dc:null,attempts:[]}],vitals:{}},

      {turn:3,minute:3,patient:'patient_1',action:'Apply direct pressure and reinforce the dressing.',scene:'The dressing shifts during placement and bright blood continues to soak through.',report:false,skip:false,procedures:[{id:'bleeding_control',patient:'patient_1',outcome:'FAILURE',intervention:true,noRoll:false,roll:6,dc:12,disadvantage:false,matchedDrug:null,administrationRoute:null,attempts:[]}],vitals:{}},

    ];
    const evidence = turns.map(turn => ({...turn,priorObservation:null,precedingIntervention:null,elapsedMinutes:null}));
    document.querySelector('#preview').append(PracticeUI.learning({version:3,scored:false,score:null,notice:'Draft review areas. Evidence for reflection only; no grade or XP impact.',timeline:turns,findings:[
      {id:'initial_approach',label:'Review your initial approach',kind:'initial_approach',evidence:[evidence[0]],reflection:{focus:'Start with your first recorded decision for each patient, whether or not vitals had appeared yet.',questions:['What information was available when you chose this approach?','What did you still need to learn before committing to treatment?'],practice:'On your next attempt, make the reasoning behind your opening approach explicit.'}},
      {id:'interventions',label:'Review your intervention decisions',kind:'intervention',evidence:[evidence[2],evidence[3]],reflection:{focus:'Review the treatments and procedures you chose. Automatically updated vitals are context, not evidence of a player-led reassessment.',questions:['Which patient findings supported each intervention?','How did the simulation response affect your next decision?'],practice:'On your next attempt, connect each intervention to the finding or concern it addresses.'}},
      {id:'handoff',label:'Communicate the assessment and care in a handoff',kind:'handoff',evidence:[evidence[4]],reflection:{focus:'Review what you communicated and what the receiving team could infer from it.',questions:['Did your report distinguish findings, actions, and response?','Which unresolved concerns needed to travel with the patient?'],practice:'Try a concise handoff that includes the patient course and remaining uncertainty.'}}
